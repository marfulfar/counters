<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Counters</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Counters">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f1ea">
<style>
  :root {
    --bg: #f4f1ea;
    --card: #ffffff;
    --ink: #22201c;
    --muted: #7a756b;
    --accent: #2f6f5e;
    --accent-ink: #ffffff;
    --line: #e2ddd1;
    --minus: #ece7da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17160f;
      --card: #23221a;
      --ink: #f1eee4;
      --muted: #9a9486;
      --accent: #5fb59d;
      --accent-ink: #10201b;
      --line: #34322a;
      --minus: #34322a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header {
    padding: 16px 16px 12px;
  }
  #newBtn {
    width: 100%;
    font: inherit;
    font-size: 17px;
    font-weight: 600;
    padding: 16px;
    border: 0;
    border-radius: 14px;
    background: var(--accent);
    color: var(--accent-ink);
  }
  #newBtn:active { opacity: .85; }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 4px 16px 24px;
    -webkit-overflow-scrolling: touch;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    margin-top: 48px;
    font-size: 15px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 10px;
    margin-bottom: 10px;
  }
  .row .mid {
    flex: 1;
    min-width: 0;
    text-align: center;
  }
  .row .titleline {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .row .name {
    font-size: 16px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .dots {
    flex: none;
    width: 36px;
    height: 32px;
    margin: -4px 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 1px;
    touch-action: manipulation;
  }
  .dots:active { background: var(--minus); }
  .row .count {
    font-size: 34px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  .step {
    width: 56px;
    height: 56px;
    flex: none;
    border: 0;
    border-radius: 14px;
    font: inherit;
    font-size: 30px;
    font-weight: 600;
    line-height: 1;
    touch-action: manipulation;
  }
  .step:active { transform: scale(.94); }
  .minus { background: var(--minus); color: var(--ink); }
  .plus { background: var(--accent); color: var(--accent-ink); }
  .minus:disabled { opacity: .35; }

  dialog {
    border: 0;
    border-radius: 18px;
    padding: 20px;
    width: min(88vw, 360px);
    background: var(--card);
    color: var(--ink);
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h2 { margin: 0 0 12px; font-size: 18px; }
  dialog input {
    width: 100%;
    font: inherit;
    font-size: 17px; /* 16px+ stops iOS zooming on focus */
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
  }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .actions button {
    flex: 1;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 12px;
    border: 0;
    border-radius: 10px;
  }
  #cancelBtn, #editCancel { background: var(--minus); color: var(--ink); }
  #createBtn, #editSave { background: var(--accent); color: var(--accent-ink); }
  #deleteBtn {
    width: 100%;
    margin-top: 12px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 12px;
    border-radius: 10px;
    background: transparent;
    color: #c0392b;
    border: 1px solid #c0392b;
  }
  #deleteBtn.armed { background: #c0392b; color: #fff; }
  @media (prefers-color-scheme: dark) {
    #deleteBtn { color: #ff8a7a; border-color: #ff8a7a; }
    #deleteBtn.armed { background: #c0392b; color: #fff; border-color: #c0392b; }
  }
</style>
</head>
<body>
  <header>
    <button id="newBtn" type="button">+ New counter</button>
  </header>

  <main id="list" aria-live="polite"></main>

  <dialog id="dlg">
    <form method="dialog" id="form">
      <h2>Name your counter</h2>
      <input id="nameInput" type="text" maxlength="60" autocomplete="off" autocapitalize="sentences" placeholder="e.g. Glasses of water" required>
      <div class="actions">
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" id="createBtn">Create</button>
      </div>
    </form>
  </dialog>

  <dialog id="editDlg">
    <form method="dialog" id="editForm">
      <h2>Edit counter</h2>
      <input id="editInput" type="text" maxlength="60" autocomplete="off" autocapitalize="sentences" required>
      <div class="actions">
        <button type="button" id="editCancel">Cancel</button>
        <button type="submit" id="editSave">Save</button>
      </div>
      <button type="button" id="deleteBtn">Delete counter</button>
    </form>
  </dialog>

<script>
(function () {
  var KEY = "counters.v1";
  var counters = load();

  var listEl = document.getElementById("list");
  var dlg = document.getElementById("dlg");
  var form = document.getElementById("form");
  var input = document.getElementById("nameInput");

  function load() {
    try {
      var data = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(data)) return data;
    } catch (e) {}
    return [];
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(counters)); } catch (e) {}
  }

  function render() {
    listEl.textContent = "";
    if (!counters.length) {
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = "No counters yet. Tap “New counter” to add one.";
      listEl.appendChild(empty);
      return;
    }
    counters.forEach(function (c) {
      var row = document.createElement("div");
      row.className = "row";

      var minus = document.createElement("button");
      minus.className = "step minus";
      minus.type = "button";
      minus.textContent = "−";
      minus.setAttribute("aria-label", "Subtract one from " + c.name);
      minus.disabled = c.count <= 0;
      minus.addEventListener("click", function () { change(c.id, -1); });

      var mid = document.createElement("div");
      mid.className = "mid";
      var titleline = document.createElement("div");
      titleline.className = "titleline";
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = c.name;
      var dots = document.createElement("button");
      dots.className = "dots";
      dots.type = "button";
      dots.textContent = "⋯";
      dots.setAttribute("aria-label", "Rename or delete " + c.name);
      dots.addEventListener("click", function () { openEdit(c.id); });
      titleline.appendChild(name);
      titleline.appendChild(dots);
      var count = document.createElement("div");
      count.className = "count";
      count.textContent = c.count;
      mid.appendChild(titleline);
      mid.appendChild(count);

      var plus = document.createElement("button");
      plus.className = "step plus";
      plus.type = "button";
      plus.textContent = "+";
      plus.setAttribute("aria-label", "Add one to " + c.name);
      plus.addEventListener("click", function () { change(c.id, 1); });

      row.appendChild(minus);
      row.appendChild(mid);
      row.appendChild(plus);
      listEl.appendChild(row);
    });
  }

  function change(id, delta) {
    for (var i = 0; i < counters.length; i++) {
      if (counters[i].id === id) {
        counters[i].count = Math.max(0, counters[i].count + delta);
        break;
      }
    }
    save();
    render();
  }

  function openDialog() {
    input.value = "";
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
    setTimeout(function () { input.focus(); }, 50);
  }
  function closeDialog() {
    if (dlg.close) dlg.close(); else dlg.removeAttribute("open");
  }

  document.getElementById("newBtn").addEventListener("click", openDialog);
  document.getElementById("cancelBtn").addEventListener("click", closeDialog);

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = input.value.trim();
    if (!name) return;
    counters.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: name, count: 0 });
    save();
    render();
    closeDialog();
    listEl.scrollTop = listEl.scrollHeight;
  });

  // --- Rename / delete ---
  var editDlg = document.getElementById("editDlg");
  var editForm = document.getElementById("editForm");
  var editInput = document.getElementById("editInput");
  var deleteBtn = document.getElementById("deleteBtn");
  var editingId = null;

  function openEdit(id) {
    var c = counters.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    editingId = id;
    editInput.value = c.name;
    disarmDelete();
    if (editDlg.showModal) editDlg.showModal(); else editDlg.setAttribute("open", "");
  }
  function closeEdit() {
    editingId = null;
    if (editDlg.close) editDlg.close(); else editDlg.removeAttribute("open");
  }
  function disarmDelete() {
    deleteBtn.classList.remove("armed");
    deleteBtn.textContent = "Delete counter";
  }

  document.getElementById("editCancel").addEventListener("click", closeEdit);

  editForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = editInput.value.trim();
    if (!name) return;
    for (var i = 0; i < counters.length; i++) {
      if (counters[i].id === editingId) { counters[i].name = name; break; }
    }
    save();
    render();
    closeEdit();
  });

  // Two taps to delete: first arms the button, second confirms.
  deleteBtn.addEventListener("click", function () {
    if (!deleteBtn.classList.contains("armed")) {
      deleteBtn.classList.add("armed");
      deleteBtn.textContent = "Tap again to delete";
      return;
    }
    counters = counters.filter(function (x) { return x.id !== editingId; });
    save();
    render();
    closeEdit();
  });

  render();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
